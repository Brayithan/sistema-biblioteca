<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de préstamos</title>
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body>

    <header>
        <h1>📖 Gestión de préstamos</h1>
        <p>Administración de préstamos de la biblioteca</p>
    </header>

    <main class="contenedor">

        <a th:href="@{/inicio}" class="btn btn-inicio">← Volver al inicio</a>

        <section class="tarjeta">
            <h2>Registrar préstamo</h2>

            <p th:if="${mensaje}" th:text="${mensaje}" class="mensaje exito"></p>
            <p th:if="${error}" th:text="${error}" class="mensaje error"></p>

            <form th:action="@{/prestamos/guardar}"
                  th:object="${prestamo}"
                  method="post">

                <div class="formulario">

                    <div class="campo">
                        <label for="idUsuario">Usuario:</label>

                        <select id="idUsuario" th:field="*{idUsuario}" required>
                            <option value="">Seleccione un usuario</option>
                            <option th:each="usuario : ${usuarios}"
                                    th:value="${usuario.idUsuario}"
                                    th:text="${usuario.nombre + ' - ' + usuario.correo}">
                            </option>
                        </select>
                    </div>

                    <div class="campo">
                        <label for="fechaPrestamo">Fecha del préstamo:</label>
                        <input type="date"
                               id="fechaPrestamo"
                               th:field="*{fechaPrestamo}"
                               required>
                    </div>

                    <div class="campo">
                        <label for="fechaDevolucion">Fecha de devolución:</label>
                        <input type="date"
                               id="fechaDevolucion"
                               th:field="*{fechaDevolucion}">
                    </div>

                </div>

                <div class="botones">
                    <button type="submit" class="btn-principal">
                        Registrar préstamo
                    </button>
                </div>

            </form>
        </section>

        <section class="tarjeta">
            <h2>Préstamos registrados</h2>

            <div class="tabla-contenedor">
                <table>
                    <thead>
                        <tr>
                            <th>ID préstamo</th>
                            <th>ID usuario</th>
                            <th>Fecha préstamo</th>
                            <th>Fecha devolución</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>

                    <tbody>
                        <tr th:each="prestamo : ${prestamos}">
                            <td th:text="${prestamo.idPrestamo}"></td>
                            <td th:text="${prestamo.idUsuario}"></td>
                            <td th:text="${prestamo.fechaPrestamo}"></td>
                            <td th:text="${prestamo.fechaDevolucion}"></td>
                            <td>
                                <a th:href="@{/prestamos/editar/{id}(id=${prestamo.idPrestamo})}"
                                   class="btn btn-secundario">
                                    Editar
                                </a>

                                <a th:href="@{/prestamos/eliminar/{id}(id=${prestamo.idPrestamo})}"
                                   class="btn btn-eliminar"
                                   onclick="return confirm('¿Deseas eliminar este préstamo?')">
                                    Eliminar
                                </a>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>

    </main>

</body>
</html>
