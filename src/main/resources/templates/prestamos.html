<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de préstamos</title>
</head>
<body>

    <h1>Gestión de préstamos</h1>

    <p th:if="${mensaje}" th:text="${mensaje}" style="color: green;"></p>
    <p th:if="${error}" th:text="${error}" style="color: red;"></p>

    <h2>Registrar préstamo</h2>

    <form th:action="@{/prestamos/guardar}"
          th:object="${prestamo}" method="post">

        <label>Usuario:</label>

        <select th:field="*{idUsuario}" required>
            <option value="">Seleccione un usuario</option>
            <option th:each="usuario : ${usuarios}"
                    th:value="${usuario.idUsuario}"
                    th:text="${usuario.nombre + ' - ' + usuario.correo}">
            </option>
        </select>

        <br><br>

        <label>Fecha del préstamo:</label>
        <input type="date" th:field="*{fechaPrestamo}" required>

        <br><br>

        <label>Fecha de devolución:</label>
        <input type="date" th:field="*{fechaDevolucion}">

        <br><br>

        <button type="submit">Registrar préstamo</button>

    </form>

    <h2>Préstamos registrados</h2>

    <table border="1">
        <thead>
            <tr>
                <th>ID préstamo</th>
                <th>ID usuario</th>
                <th>Fecha préstamo</th>
                <th>Fecha devolución</th>
                <th>Acciones</th>
            </tr>
        </thead>

        <tbody>
            <tr th:each="prestamo : ${prestamos}">
                <td th:text="${prestamo.idPrestamo}"></td>
                <td th:text="${prestamo.idUsuario}"></td>
                <td th:text="${prestamo.fechaPrestamo}"></td>
                <td th:text="${prestamo.fechaDevolucion}"></td>
                <td>
                    <a th:href="@{/prestamos/editar/{id}(id=${prestamo.idPrestamo})}">
    Editar
    |
</a>
                    <a th:href="@{/prestamos/eliminar/{id}(id=${prestamo.idPrestamo})}"
                       onclick="return confirm('¿Deseas eliminar este préstamo?')">
                        Eliminar
                    </a>
                </td>
            </tr>
        </tbody>
    </table>

    <br>
    <a href="/">Volver al inicio</a>

</body>
</html>
