<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión - Biblioteca</title>
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body>

    <header>
        <h1>📚 Sistema de Gestión Bibliotecaria</h1>
        <p>Bienvenido a nuestra biblioteca</p>
    </header>

    <main class="contenedor">

        <section class="tarjeta" style="max-width: 450px; margin: 40px auto;">

            <h2 style="text-align: center;">Iniciar sesión</h2>

            <p th:if="${error}" th:text="${error}" class="mensaje error"></p>
            <p th:if="${mensaje}" th:text="${mensaje}" class="mensaje exito"></p>

            <form th:action="@{/login}" method="post">

                <div class="campo">
                    <label for="correo">Correo electrónico:</label>
                    <input type="email"
                           id="correo"
                           name="correo"
                           placeholder="Ingrese su correo electrónico"
                           required>
                </div>

                <br>

                <div class="campo">
                    <label for="contrasena">Contraseña:</label>
                    <input type="password"
                           id="contrasena"
                           name="contrasena"
                           placeholder="Ingrese su contraseña"
                           required>
                </div>

                <div class="botones">
                    <button type="submit" class="btn-principal" style="width: 100%;">
                        Ingresar
                    </button>
                </div>

            </form>

            <hr style="margin: 25px 0; border: 1px solid #eeeeee;">

            <p style="text-align: center;">
                ¿No tienes una cuenta?
            </p>

            <div style="text-align: center; margin-top: 12px;">
                <a th:href="@{/registro}" class="btn btn-secundario">
                    Crear una cuenta
                </a>
            </div>

        </section>

    </main>

</body>
</html>
