<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de categorías</title>
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body>

    <header>
        <h1>📚 Gestión de categorías</h1>
        <p>Administración de categorías de la biblioteca</p>
    </header>

    <main class="contenedor">

        <a th:href="@{/}" class="btn btn-inicio">← Volver al inicio</a>

        <section class="tarjeta">
            <h2>Registrar categoría</h2>

            <form th:action="@{/categorias/guardar}"
                  th:object="${categoria}"
                  method="post">

                <div class="campo">
                    <label for="nombre">Nombre de la categoría:</label>

                    <input type="text"
                           id="nombre"
                           th:field="*{nombre}"
                           placeholder="Ingrese el nombre de la categoría"
                           required>
                </div>

                <div class="botones">
                    <button type="submit" class="btn-principal">
                        Guardar categoría
                    </button>
                </div>

            </form>
        </section>

        <section class="tarjeta">
            <h2>Categorías registradas</h2>

            <p th:if="${mensaje}" th:text="${mensaje}" class="mensaje exito"></p>
            <p th:if="${error}" th:text="${error}" class="mensaje error"></p>

            <div class="tabla-contenedor">
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Nombre</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>

                    <tbody>
                        <tr th:each="categoria : ${categorias}">
                            <td th:text="${categoria.idCategoria}"></td>
                            <td th:text="${categoria.nombre}"></td>
                            <td>
                                <a th:href="@{/categorias/editar/{id}(id=${categoria.idCategoria})}"
                                   class="btn btn-secundario">
                                    Editar
                                </a>

                                <a th:href="@{/categorias/eliminar/{id}(id=${categoria.idCategoria})}"
                                   class="btn btn-eliminar"
                                   onclick="return confirm('¿Deseas eliminar esta categoría?')">
                                    Eliminar
                                </a>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>

    </main>

</body>
</html>
