<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de categorías</title>
</head>
<body>

    <h1>Gestión de categorías</h1>

    <h2>Registrar categoría</h2>

    <form th:action="@{/categorias/guardar}"
          th:object="${categoria}" method="post">

        <label for="nombre">Nombre de la categoría:</label>

        <input type="text" id="nombre"
               th:field="*{nombre}" required>

        <button type="submit">Guardar categoría</button>
    </form>

    <h2>Categorías registradas</h2>

    <p th:if="${mensaje}" th:text="${mensaje}" style="color: green;"></p>

    <p th:if="${error}" th:text="${error}" style="color: red;"></p>

    <table border="1">
        <thead>
            <tr>
                <th>ID</th>
                <th>Nombre</th>
                <th>Acciones</th>
            </tr>
        </thead>

        <tbody>
            <tr th:each="categoria : ${categorias}">
                <td th:text="${categoria.idCategoria}"></td>
                <td th:text="${categoria.nombre}"></td>
                <td>
                    <a th:href="@{/categorias/editar/{id}(id=${categoria.idCategoria})}">
    Editar
</a>
                    <a th:href="@{/categorias/eliminar/{id}(id=${categoria.idCategoria})}"
                       onclick="return confirm('¿Deseas eliminar esta categoría?')">
                        Eliminar
                    </a>
                </td>
            </tr>
        </tbody>
    </table>

    <br>
    <a href="/">Volver al inicio</a>

</body>
</html>
