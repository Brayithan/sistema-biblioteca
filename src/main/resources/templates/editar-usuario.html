<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Editar usuario</title>
</head>
<body>

    <h1>Editar usuario</h1>

    <form th:action="@{/usuarios/actualizar}" th:object="${usuario}" method="post">

        <input type="hidden" th:field="*{idUsuario}">

        <label>Nombre:</label>
        <input type="text" th:field="*{nombre}" required>
        <br><br>

        <label>Correo:</label>
        <input type="email" th:field="*{correo}" required>
        <br><br>

        <label>Teléfono:</label>
        <input type="text" th:field="*{telefono}">
        <br><br>

        <label>Dirección:</label>
        <input type="text" th:field="*{direccion}">
        <br><br>

        <button type="submit">Guardar cambios</button>

    </form>

    <br>
    <a href="/usuarios">Volver a usuarios</a>

</body>
</html>
