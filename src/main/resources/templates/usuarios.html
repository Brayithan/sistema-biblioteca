<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de usuarios</title>
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body>

    <header>
        <h1>👥 Gestión de usuarios</h1>
        <p>Administración de usuarios de la biblioteca</p>
    </header>

    <main class="contenedor">

        <a th:href="@{/}" class="btn btn-inicio">← Volver al inicio</a>

        <section class="tarjeta">
            <h2>Registrar usuario</h2>

            <p th:if="${mensaje}" th:text="${mensaje}" class="mensaje exito"></p>
            <p th:if="${error}" th:text="${error}" class="mensaje error"></p>

            <form th:action="@{/usuarios/guardar}"
                  th:object="${usuario}"
                  method="post">

                <div class="formulario">

                    <div class="campo">
                        <label for="nombre">Nombre:</label>
                        <input type="text"
                               id="nombre"
                               th:field="*{nombre}"
                               placeholder="Ingrese el nombre"
                               required>
                    </div>

                    <div class="campo">
                        <label for="correo">Correo:</label>
                        <input type="email"
                               id="correo"
                               th:field="*{correo}"
                               placeholder="Ingrese el correo"
                               required>
                    </div>

                    <div class="campo">
                        <label for="telefono">Teléfono:</label>
                        <input type="text"
                               id="telefono"
                               th:field="*{telefono}"
                               placeholder="Ingrese el teléfono">
                    </div>

                    <div class="campo">
                        <label for="direccion">Dirección:</label>
                        <input type="text"
                               id="direccion"
                               th:field="*{direccion}"
                               placeholder="Ingrese la dirección">
                    </div>

                    <div class="campo">
                        <label for="contrasena">Contraseña:</label>
                        <input type="password"
                               id="contrasena"
                               th:field="*{contrasena}"
                               placeholder="Ingrese una contraseña"
                               required>
                    </div>

                </div>

                <div class="botones">
                    <button type="submit" class="btn-principal">
                        Guardar usuario
                    </button>
                </div>

            </form>
        </section>

        <section class="tarjeta">
            <h2>Usuarios registrados</h2>

            <div class="tabla-contenedor">
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Nombre</th>
                            <th>Correo</th>
                            <th>Teléfono</th>
                            <th>Dirección</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>

                    <tbody>
                        <tr th:each="usuario : ${usuarios}">
                            <td th:text="${usuario.idUsuario}"></td>
                            <td th:text="${usuario.nombre}"></td>
                            <td th:text="${usuario.correo}"></td>
                            <td th:text="${usuario.telefono}"></td>
                            <td th:text="${usuario.direccion}"></td>
                            <td>
                                <a th:href="@{/usuarios/editar/{id}(id=${usuario.idUsuario})}"
                                   class="btn btn-secundario">
                                    Editar
                                </a>

                                <a th:href="@{/usuarios/eliminar/{id}(id=${usuario.idUsuario})}"
                                   class="btn btn-eliminar"
                                   onclick="return confirm('¿Deseas eliminar este usuario?')">
                                    Eliminar
                                </a>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>

    </main>

</body>
</html>
