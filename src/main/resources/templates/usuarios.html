<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de usuarios</title>
</head>
<body>

    <h1>Gestión de usuarios</h1>

    <h2>Registrar usuario</h2>

    <p th:if="${mensaje}" th:text="${mensaje}" style="color: green;"></p>
    <p th:if="${error}" th:text="${error}" style="color: red;"></p>

    <form th:action="@{/usuarios/guardar}"
          th:object="${usuario}" method="post">

        <label>Nombre:</label>
        <input type="text" th:field="*{nombre}" required>

        <br><br>

        <label>Correo:</label>
        <input type="email" th:field="*{correo}" required>

        <br><br>

        <label>Teléfono:</label>
        <input type="text" th:field="*{telefono}">

        <br><br>

        <label>Dirección:</label>
        <input type="text" th:field="*{direccion}">

        <br><br>

        <label>Contraseña:</label>
        <input type="password" th:field="*{contrasena}" required>

        <br><br>

        <button type="submit">Guardar usuario</button>

    </form>

    <h2>Usuarios registrados</h2>

    <table border="1">
        <thead>
            <tr>
                <th>ID</th>
                <th>Nombre</th>
                <th>Correo</th>
                <th>Teléfono</th>
                <th>Dirección</th>
                <th>Acciones</th>
            </tr>
        </thead>

        <tbody>
            <tr th:each="usuario : ${usuarios}">
                <td th:text="${usuario.idUsuario}"></td>
                <td th:text="${usuario.nombre}"></td>
                <td th:text="${usuario.correo}"></td>
                <td th:text="${usuario.telefono}"></td>
                <td th:text="${usuario.direccion}"></td>
                <td>
                    <a th:href="@{/usuarios/editar/{id}(id=${usuario.idUsuario})}">
    Editar
</a>
|
                    <a th:href="@{/usuarios/eliminar/{id}(id=${usuario.idUsuario})}"
                       onclick="return confirm('¿Deseas eliminar este usuario?')">
                        Eliminar
                    </a>
                </td>
            </tr>
        </tbody>
    </table>

    <br>
    <a href="/">Volver al inicio</a>

</body>
</html>
