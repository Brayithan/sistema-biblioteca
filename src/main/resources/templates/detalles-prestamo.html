<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalles de préstamos</title>
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body>

    <header>
        <h1>📋 Gestión de detalles de préstamos</h1>
        <p>Administración de libros asociados a los préstamos</p>
    </header>

    <main class="contenedor">

        <a th:href="@{/inicio}" class="btn btn-inicio">← Volver al inicio</a>

        <section class="tarjeta">
            <h2>Asociar libro a préstamo</h2>

            <p th:if="${mensaje}" th:text="${mensaje}" class="mensaje exito"></p>
            <p th:if="${error}" th:text="${error}" class="mensaje error"></p>

            <form th:action="@{/detalles-prestamo/guardar}"
                  th:object="${detalle}"
                  method="post">

                <div class="formulario">

                    <div class="campo">
                        <label for="idPrestamo">Préstamo:</label>

                        <select id="idPrestamo" th:field="*{idPrestamo}" required>
                            <option value="">Seleccione un préstamo</option>

                            <option th:each="prestamo : ${prestamos}"
                                    th:value="${prestamo.idPrestamo}"
                                    th:text="${'Préstamo #' + prestamo.idPrestamo + ' - Usuario #' + prestamo.idUsuario}">
                            </option>
                        </select>
                    </div>

                    <div class="campo">
                        <label for="idLibro">Libro:</label>

                        <select id="idLibro" th:field="*{idLibro}" required>
                            <option value="">Seleccione un libro</option>

                            <option th:each="libro : ${libros}"
                                    th:value="${libro.idLibro}"
                                    th:text="${libro.titulo}">
                            </option>
                        </select>
                    </div>

                </div>

                <div class="botones">
                    <button type="submit" class="btn-principal">
                        Asociar libro
                    </button>
                </div>

            </form>
        </section>

        <section class="tarjeta">
            <h2>Detalles registrados</h2>

            <div class="tabla-contenedor">
                <table>
                    <thead>
                        <tr>
                            <th>ID detalle</th>
                            <th>ID préstamo</th>
                            <th>ID libro</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>

                    <tbody>
                        <tr th:each="detalle : ${detalles}">
                            <td th:text="${detalle.idDetalle}"></td>
                            <td th:text="${detalle.idPrestamo}"></td>
                            <td th:text="${detalle.idLibro}"></td>
                            <td>
                                <a th:href="@{/detalles-prestamo/editar/{id}(id=${detalle.idDetalle})}"
                                   class="btn btn-secundario">
                                    Editar
                                </a>

                                <a th:href="@{/detalles-prestamo/eliminar/{id}(id=${detalle.idDetalle})}"
                                   class="btn btn-eliminar"
                                   onclick="return confirm('¿Estás seguro de eliminar este detalle?')">
                                    Eliminar
                                </a>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>

    </main>

</body>
</html>
