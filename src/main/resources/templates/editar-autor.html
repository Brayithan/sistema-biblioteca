<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar autor</title>
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body>

    <header>
        <h1>✍️ Editar autor</h1>
        <p>Actualizar información del autor</p>
    </header>

    <main class="contenedor">

        <section class="tarjeta">
            <h2>Modificar datos del autor</h2>

            <form th:action="@{/autores/actualizar}"
                  th:object="${autor}"
                  method="post">

                <input type="hidden" th:field="*{idAutor}">

                <div class="campo">
                    <label for="nombre">Nombre del autor:</label>

                    <input type="text"
                           id="nombre"
                           th:field="*{nombre}"
                           placeholder="Ingrese el nombre del autor"
                           required>
                </div>

                <div class="botones">
                    <button type="submit" class="btn-principal">
                        Guardar cambios
                    </button>

                    <a th:href="@{/autores}" class="btn btn-secundario">
                        Cancelar
                    </a>
                </div>

            </form>
        </section>

    </main>

</body>
</html>
