<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar préstamo</title>
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body>

    <header>
        <h1>📖 Editar préstamo</h1>
        <p>Actualizar información del préstamo</p>
    </header>

    <main class="contenedor">

        <section class="tarjeta">
            <h2>Modificar datos del préstamo</h2>

            <form th:action="@{/prestamos/actualizar}"
                  th:object="${prestamo}"
                  method="post">

                <input type="hidden" th:field="*{idPrestamo}">

                <div class="formulario">

                    <div class="campo">
                        <label for="idUsuario">Usuario:</label>

                        <select id="idUsuario" th:field="*{idUsuario}" required>
                            <option value="">Seleccione un usuario</option>
                            <option th:each="usuario : ${usuarios}"
                                    th:value="${usuario.idUsuario}"
                                    th:text="${usuario.nombre}">
                            </option>
                        </select>
                    </div>

                    <div class="campo">
                        <label for="fechaPrestamo">Fecha del préstamo:</label>
                        <input type="date"
                               id="fechaPrestamo"
                               th:field="*{fechaPrestamo}"
                               required>
                    </div>

                    <div class="campo">
                        <label for="fechaDevolucion">Fecha de devolución:</label>
                        <input type="date"
                               id="fechaDevolucion"
                               th:field="*{fechaDevolucion}">
                    </div>

                </div>

                <div class="botones">
                    <button type="submit" class="btn-principal">
                        Guardar cambios
                    </button>

                    <a th:href="@{/prestamos}" class="btn btn-secundario">
                        Cancelar
                    </a>
                </div>

            </form>
        </section>

    </main>

</body>
</html>
