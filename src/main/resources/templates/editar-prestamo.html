<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Editar préstamo</title>
</head>
<body>

    <h1>Editar préstamo</h1>

    <form th:action="@{/prestamos/actualizar}" th:object="${prestamo}" method="post">

        <input type="hidden" th:field="*{idPrestamo}">

        <label>Usuario:</label>
        <select th:field="*{idUsuario}" required>
            <option value="">Seleccione un usuario</option>
            <option th:each="usuario : ${usuarios}"
                    th:value="${usuario.idUsuario}"
                    th:text="${usuario.nombre}">
            </option>
        </select>

        <br><br>

        <label>Fecha del préstamo:</label>
        <input type="date" th:field="*{fechaPrestamo}" required>

        <br><br>

        <label>Fecha de devolución:</label>
        <input type="date" th:field="*{fechaDevolucion}">

        <br><br>

        <button type="submit">Guardar cambios</button>

    </form>

    <br>
    <a href="/prestamos">Volver a préstamos</a>

</body>
</html>
