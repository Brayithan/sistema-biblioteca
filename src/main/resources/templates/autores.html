
<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de autores</title>
</head>
<body>

    <h1>Gestión de autores</h1>

    <h2>Registrar autor</h2>

    <form th:action="@{/autores/guardar}" th:object="${autor}" method="post">

        <label for="nombre">Nombre del autor:</label>

        <input type="text"
               id="nombre"
               th:field="*{nombre}"
               required>

        <button type="submit">Guardar autor</button>

    </form>

    <h2>Autores registrados</h2>
    <p th:if="${mensaje}" th:text="${mensaje}" style="color: green;"></p>

<p th:if="${error}" th:text="${error}" style="color: red;"></p>

    <table border="1">

        <thead>
            <tr>
                <th>ID</th>
                <th>Nombre</th>
                <th>Acciones</th>
            </tr>
        </thead>

        <tbody>

            <tr th:each="autor : ${autores}">

                <td th:text="${autor.idAutor}"></td>

                <td th:text="${autor.nombre}"></td>

                <td>
    <a th:href="@{/autores/editar/{id}(id=${autor.idAutor})}">
        Editar
    </a>

    |

    <a th:href="@{/autores/eliminar/{id}(id=${autor.idAutor})}"
       onclick="return confirm('¿Deseas eliminar este autor?')">
        Eliminar
    </a>
</td>

            </tr>

        </tbody>

    </table>

    <br>

    <a href="/">Volver al inicio</a>

</body>
</html>
